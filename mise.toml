[tools]
ollama = "0.34.2"
python = "3.14.7"
uv = "0.12.17"

[env]
_.file = ".env"

[tasks.check]
description = "Format check, lint, type check, tests"
run = [
    "uv run ruff format --check .",
    "uv run ruff check .",
    "uv run pyright",
    "uv run pytest",
]

[tasks.fix]
description = "Format and auto-fix lint"
run = ["uv run ruff format .", "uv run ruff check --fix ."]
